<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico ERP</title>
    <style>
      body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
      #log-box { 
        background: #000; color: #0f0; 
        padding: 15px; border-radius: 5px; 
        font-family: monospace; height: 300px; overflow-y: auto;
        border: 2px solid #333;
      }
      .btn { padding: 10px 20px; background: #0854a0; color: white; border: none; cursor: pointer; margin-top: 10px;}
    </style>
  </head>
  <body>

    <h2>🛠 Modo de Diagnóstico</h2>
    <p>Este ecrã vai ajudar-nos a descobrir porque é que o sistema travou.</p>
    
    <div id="log-box">A iniciar sistema...<br></div>
    <button class="btn" onclick="tentaler()">Tentar Carregar Novamente</button>

    <script>
      // A URL que você enviou:
      const API_URL = "https://script.google.com/macros/s/AKfycbxfgn4nfDZ5RHySA5ibOzFhZVofGzaiHIiBvfhrDadtEGf98sao3S-PSM5CmMy67T9e/exec";

      function log(texto) {
        const box = document.getElementById('log-box');
        box.innerHTML += `> ${texto}<br>`;
        console.log(texto);
      }

      window.onload = function() {
        log("Página carregada.");
        tentaler();
      }

      function tentaler() {
        log("--------------------------------");
        log("1. A iniciar conexão com o Google...");
        log(`   URL: ${API_URL.substring(0, 50)}...`);

        fetch(API_URL + "?op=getDados")
          .then(response => {
            log(`2. Resposta recebida! Status: ${response.status}`);
            if (!response.ok) {
              throw new Error(`Erro HTTP: ${response.status}`);
            }
            return response.text(); // Lemos como texto primeiro para ver o que vem
          })
          .then(texto => {
            log("3. Dados brutos recebidos.");
            // Tenta ver se é HTML (erro comum)
            if (texto.trim().startsWith("<")) {
              log("❌ ERRO CRÍTICO: A API retornou HTML em vez de dados.");
              log("   Isso significa que o link está abrindo o SITE antigo e não a API.");
              log("   SOLUÇÃO: No Google Script, vá em Implantar > Nova Versão.");
              return;
            }
            
            try {
              const json = JSON.parse(texto);
              log("4. ✅ Sucesso! Dados convertidos para JSON.");
              log("   Itens encontrados: " + Object.keys(json).length + " dias.");
              log("   O sistema está pronto para voltar ao código original.");
            } catch (e) {
              log("❌ ERRO: Não foi possível ler o JSON.");
              log("   Conteúdo recebido: " + texto.substring(0, 50) + "...");
            }
          })
          .catch(erro => {
            log("❌ FALHA NA CONEXÃO:");
            log("   " + erro.message);
            log("   Verifique se a implantação está como 'Qualquer pessoa'.");
          });
      }
    </script>
  </body>
</html>
